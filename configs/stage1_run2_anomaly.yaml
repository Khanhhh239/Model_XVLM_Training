# STAGE 1.5 — Run 2: safe config + anomaly_head ONLY
# Use AFTER Run 1 (stage1_safe_warmstart.yaml) confirms baseline ~0.80 and fine-tune beats it.
# ONE lever: anomaly_head (Ca/Cn binary) — highest priority because PAB = anomaly-detection.
# Simple MLP head + 500-step ramp = lowest risk of warm-start disruption.
# Run:  python scripts/train.py --config configs/stage1_run2_anomaly.yaml --init-from <best.pth from Run1>
#       (or --init-from "best (3).pth" if Run 1 did not improve)

data:
  manifest: /kaggle/working/manifest_30k_hard_enhanced.parquet
  image_root: /kaggle/input/aicity-30k-hard-enhanced/data/train_webp
  image_size: 384
  max_token: 100
  lhp_enabled: true
  lhp_min_scale: 0.5
  lhp_use_bbox: true
  group_by: pair
  group_fraction: 0.5
  num_workers: 2
  vitpose_json: /kaggle/input/aicity-30k-hard-enhanced/data/subsets/prepared/train_30k_hard_vitpose.json
  boxes_json: null
  phrase_boxes_json: null         # still OFF
  remine_each_epoch: false        # still OFF
  mine_fraction: 0.0
  hard_edges_json: null

model:
  backbone: xvlm
  checkpoint: /kaggle/input/ckpt-30k-hard/xvlm_16m_base.th
  embed_dim: 256
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [query, value]
  lora_freeze_text: true
  pose_enabled: true
  pose_hidden: 256
  bbox_enabled: false             # still OFF (Run 3)
  anomaly_enabled: true           # ← NEW: Ca/Cn binary head
  phrase_box_enabled: false       # still OFF (Run 6)

loss:
  w_itc: 1.0
  lambda_itm: 2.0
  lambda_smooth_ap: 0.2
  lambda_box: 0.0
  lambda_anomaly: 0.2             # ← NEW: ramped 0→0.2 over 500 steps
  anomaly_rampup_steps: 500
  lambda_action: 0.0
  lambda_phrase_box: 0.0
  xbm_enabled: false              # still OFF (Run 4)
  weighting: fixed
  itc_temp_init: 0.07
  smooth_ap_temp: 0.01

optim:
  lr_lora: 1.5e-5
  lr_head: 1.0e-4
  weight_decay: 0.02
  betas: [0.9, 0.999]
  grad_clip: 5.0
  warmup_epochs: 0.5
  epochs: 6

train:
  batch_size: 12
  grad_accum: 2
  amp_dtype: fp16
  grad_checkpointing: true
  eval_every_epochs: 0.5
  early_stop_patience: 2
  grad_norm_every: 0
  seed: 42
  out_dir: /kaggle/working/out_stage1_run2
