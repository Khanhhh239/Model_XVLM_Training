# STAGE 1.5 — Run 5: Run 4 config + action_head
# Use AFTER Run 4 confirms mAP > Run 3.
# ONE lever: action-keyword InfoNCE (image <-> action-phrase alignment).
# Run:  python scripts/train.py --config configs/stage1_run5_action.yaml --init-from <best.pth from Run4>

data:
  manifest: /kaggle/working/manifest_30k_hard_enhanced.parquet
  image_root: /kaggle/input/aicity-30k-hard-enhanced/data/train_webp
  image_size: 384
  max_token: 100
  lhp_enabled: true
  lhp_min_scale: 0.5
  lhp_use_bbox: true
  group_by: pair
  group_fraction: 0.5
  num_workers: 2
  vitpose_json: /kaggle/input/aicity-30k-hard-enhanced/data/subsets/prepared/train_30k_hard_vitpose.json
  boxes_json: null
  phrase_boxes_json: null
  remine_each_epoch: true
  mine_fraction: 0.1
  hard_edges_json: /kaggle/input/aicity-30k-hard-enhanced/data/subsets/hard_edges_30k_hard.jsonl

model:
  backbone: xvlm
  checkpoint: /kaggle/input/ckpt-30k-hard/xvlm_16m_base.th
  embed_dim: 256
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [query, value]
  lora_freeze_text: true
  pose_enabled: true
  pose_hidden: 256
  bbox_enabled: true
  anomaly_enabled: true
  phrase_box_enabled: false

loss:
  w_itc: 1.0
  lambda_itm: 2.0
  lambda_smooth_ap: 0.2
  lambda_box: 0.1
  box_rampup_steps: 500
  w_box_giou: 2.0
  w_box_l1: 5.0
  lambda_anomaly: 0.2
  anomaly_rampup_steps: 500
  lambda_action: 0.2              # ← NEW: image <-> action-phrase InfoNCE
  action_rampup_steps: 500
  action_temp: 0.07
  lambda_phrase_box: 0.0
  xbm_enabled: true
  xbm_size: 1024
  weighting: fixed
  itc_temp_init: 0.07
  smooth_ap_temp: 0.01

optim:
  lr_lora: 1.5e-5
  lr_head: 1.0e-4
  weight_decay: 0.02
  betas: [0.9, 0.999]
  grad_clip: 5.0
  warmup_epochs: 0.5
  epochs: 6

train:
  batch_size: 12
  grad_accum: 2
  amp_dtype: fp16
  grad_checkpointing: true
  eval_every_epochs: 0.5
  early_stop_patience: 2
  grad_norm_every: 0
  seed: 42
  out_dir: /kaggle/working/out_stage1_run5
