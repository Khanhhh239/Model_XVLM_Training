# STAGE 1.5 — Run 4 (CLEAN): XBM + ANCE on the proven recipe ONLY. No aux heads.
# This is the ONE remaining lever that targets the bi-encoder retrieval DIRECTLY (what VAL-B measures),
# unlike the aux heads (anomaly/bbox/phrase-box) which reshape encoders indirectly and were discarded
# at inference. Two contrastive-side levers, no fresh random head:
#   XBM 1024  = ~85 batches of past embeddings as extra ITC negatives (T4 batch is small). 1024 not 8192
#               so the queued embeddings aren't stale at lr=1.5e-5.
#   ANCE 0.1  = re-encode all train each epoch, mine cross-ID hard negatives (look-alike, diff ID),
#               replace 10% of pairs; keep 90% same-video (the signal that built 0.80). hard_edges OFF
#               (file not present on Kaggle; load_hard_edges returns [] -> mined+same-video only, fine).
# Warm-init from best (4).pth (0.8323). Verdict on the VAL-B floor 0.8323 decides if this lever helps.
# Run:  python scripts/train.py --config configs/stage1_run4_xbm_ance.yaml --init-from <best (4).pth>

data:
  manifest: /kaggle/working/manifest_30k_hard_enhanced.parquet
  image_root: /kaggle/input/aicity-30k-hard-enhanced/data/train_webp
  image_size: 384
  max_token: 100
  lhp_enabled: true               # LHP + sim2real aug — part of the 0.80 recipe
  lhp_min_scale: 0.5
  lhp_use_bbox: true
  group_by: pair                  # PairBatchSampler — required for remine; the proven lever
  group_fraction: 0.5
  num_workers: 2
  vitpose_json: null
  boxes_json: null
  phrase_boxes_json: null         # OFF
  remine_each_epoch: true         # ← ANCE: re-mine cross-ID hard negatives with the current model
  mine_fraction: 0.1              # ← 10% mined, 90% same-video kept
  hard_edges_json: null           # OFF — not on Kaggle; ANCE uses mined cross-ID + same-video base

model:
  backbone: xvlm
  checkpoint: /kaggle/input/ckpt-30k-hard/xvlm_16m_base.th
  embed_dim: 256
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [query, value]
  lora_freeze_text: true
  pose_enabled: true              # part of best(3) — ON
  pose_hidden: 256
  bbox_enabled: false             # OFF — no aux heads this run
  anomaly_enabled: false          # OFF
  phrase_box_enabled: false       # OFF

loss:
  w_itc: 1.0
  lambda_itm: 2.0                 # main rank-1 lever (kept)
  lambda_smooth_ap: 0.2          # kept
  lambda_box: 0.0
  lambda_anomaly: 0.0
  lambda_action: 0.0
  lambda_phrase_box: 0.0
  xbm_enabled: true              # ← XBM queue ON
  xbm_size: 1024                 # 1024 not 8192 — ~85 batches back, not stale at lr 1.5e-5
  weighting: fixed
  itc_temp_init: 0.07
  smooth_ap_temp: 0.01

optim:
  lr_lora: 1.5e-5
  lr_head: 1.0e-4
  weight_decay: 0.02
  betas: [0.9, 0.999]
  grad_clip: 5.0
  warmup_epochs: 0.5
  epochs: 6

train:
  batch_size: 12                 # no phrase-box cross-encodes -> 12 fits (XBM queue is cheap memory)
  grad_accum: 2                  # effective 24
  amp_dtype: fp16
  grad_checkpointing: true
  eval_every_epochs: 0.5
  early_stop_patience: 4         # decoupled early-stop tracks run's own best, not the floor
  grad_norm_every: 0
  seed: 42
  out_dir: /kaggle/working/out_stage1_run4
