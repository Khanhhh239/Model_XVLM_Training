# SAFE 100K fine-tune of the 80-mAP CMP checkpoint. Paths assume you run inside a cloned CMP repo
# with PAB downloaded under data/PAB. ADJUST paths to your machine.

## --- CMP base (must match the checkpoint) ---
vision_config: 'configs/config_swinB.json'
text_config:   'configs/config_bert.json'
text_encoder:  'checkpoint/bert-base-uncased'      # local bert dir
load_pretrained: True
h: 224
w: 224
embed_dim: 2048
vision_width: 1024            # swin-base final dim (anomaly-head input) — VERIFY for your ckpt
temp: 0.07
label_smooth: 0.2
itc_dp: 0.5
max_words: 56
max_tokens: 56
## mlm
mask_prob: 0.25
max_masks: 10
skipgram_prb: 0.2
skipgram_size: 3
mask_whole_word: True
eda_p: 1

## --- CMP branches ON (data has hard_i + pose) ---
be_hard: True
be_pose_img: True
pose_conv: True

## --- fine-tune additions ---
use_lora: True                # LoRA encoders; False = freeze encoders (ultra-safe fallback)
lora_r: 16
use_mined_neg: True           # ANCE cross-ID mined hard negatives
mine_topk: 10
w_anom: 0.2                   # anomaly head loss weight
sim2real_p: 1.0              # blur/JPEG/downscale aug strength gate
erasing_p: 0.5

## --- optimization (LOW lr so we don't degrade the 80-mAP base) ---
epochs: 3
batch_size: 32
lr_enc: 5.0e-5               # LoRA encoder params
lr_head: 2.0e-5             # full-FT cross/itm/anomaly/pose — kept low
ema: 0.999
eval_every: 500

## --- data paths (ADJUST) ---
image_root: 'data/PAB/'                                   # contains train/ and pose/train/
train_file_subset: 'data/PAB/annotation/train/attr_100k.json'   # from sample_100k.py
## --- distractor-val (the safety gauge) ---
val_dir: 'data/PAB/annotation/test'                      # has attr.json (old labeled test) + the GT images near it
val_gallery_dir: 'data/PAB/name-masked_test-set/gallery' # competition gallery (distractor source)
val_n_distract: 5000
