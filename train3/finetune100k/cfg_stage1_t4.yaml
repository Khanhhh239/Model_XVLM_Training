# Stage-1 Kaggle-T4 config (the kaggle_stage1 notebook regenerates this with detected paths).
# Stage 1 = freeze Swin + BERT-lower, full-FT fusion+heads, @224 (matches cmp.pth -> baseline reproduces 80),
# ITC(+XBM)+ITM(+ID-hard+mined)+anomaly+box, drop MLM. 384/512 is Stage 2 (vision trainable).

## CMP base
vision_config: 'configs/config_swinB.json'
text_config:   'configs/config_bert.json'
text_encoder:  'checkpoint/bert-base-uncased'
load_pretrained: True
h: 224                 # Stage 1 @224 (cmp.pth native -> no swin pos-embed interpolation risk)
w: 224
embed_dim: 2048
vision_width: 1024
temp: 0.07
label_smooth: 0.2
itc_dp: 0.5
max_words: 56
max_tokens: 56
be_hard: True
be_pose_img: True
pose_conv: True

## Stage-1 freeze policy + heads
n_text_frozen: 6       # freeze BERT layers 0..5 (text); full-FT 6..11 (fusion) + heads
freeze_vision: True    # Swin frozen (no_grad) -> no OOM; flip to false only on A100 (Stage 2)
xbm_size: 8192
grad_ckpt: True

## losses
w_anom: 0.2
w_box: 0.1             # 0 to disable box; needs boxes_file (else auto-skipped)
box_p: 2
box_src_size: 384      # boxes_30k.jsonl coords are in 384px (webp) -> normalize by this
use_mined_neg: True
mine_topk: 10

## optim (LOW lr to preserve 80; new heads higher)
epochs: 2
batch_size: 16         # fallback 12/8 if OOM
lr_old: 2.0e-5
lr_new: 1.0e-4
ema: 0.999
eval_every: 400
erasing_p: 0.5
sim2real_p: 1.0

## data paths (notebook fills these from /kaggle/input + extracted dir)
webp_root: 'data/train_webp'
pose_root: '/kaggle/working/pose'
train_file_subset: 'data/subsets/train_30k_hard.jsonl'
boxes_file: '/kaggle/working/boxes_30k.jsonl'
val_dir: 'data/PAB/annotation/test'
val_gallery_dir: 'data/name-masked_test-set/gallery'
val_n_distract: 5000
