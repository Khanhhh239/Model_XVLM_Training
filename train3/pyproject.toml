[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "startv4"
version = "0.1.0"
description = "STAR-v4: Text-Based Person Anomaly Retrieval (AI City 2026 Track 4)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision",
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
hf = ["transformers>=4.49", "peft>=0.10"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["startv4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
