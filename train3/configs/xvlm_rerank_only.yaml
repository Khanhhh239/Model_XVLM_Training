# X-VLM-v4 RERANK-ONLY (Model B) -- the pragmatic, no-waste reranker config.
# Use this ONLY after distractor-val shows the gap is PRECISION (GT already in top-K, mis-ranked),
# not recall.  It trains JUST the ITM cross-encoder head -- ITC, the 65K MoCo queue, Smooth-AP and
# FILIP are all OFF (w=0 / queue_size=0), so there is no speculative second contrastive model.
# Strongest setup: warm_start from the PRETRAINED X-VLM in .. to reuse its pretrained ITM.
model:
  name: hf
  image_model: microsoft/swin-base-patch4-window7-224
  text_model: bert-base-uncased
  embed_dim: 256
  cross_layers: 6
  cross_heads: 8
  num_anomaly_classes: 3
  use_pose: false
  use_anomaly: false           # rerank-only: ITM is the single objective
  use_box: false
  use_filip: false

data:
  manifest: data/manifest_1m.parquet
  image_root: data/images
  image_size: 512
  max_token: 64
  num_workers: 16
  sampler: pair                # same-video hard pairs feed the ITM hard-negative sampler

train:
  batch_size: 64
  seed: 42

optim:
  lr: 2.0e-4
  wd: 0.05
  epochs: 4
  warmup_epochs: 1
  grad_clip: 1.0
  bf16: true
  grad_checkpoint: true
  ema: true
  ema_decay: 0.999
  queue_size: 0                # no ITC -> no queue
  warm_start: null             # e.g. ../.../best.pth (reuse pretrained ITM)
  w_itc: 0.0                   # OFF (rerank-only)
  w_itm: 1.0
  w_filip: 0.0
  w_box: 0.0
  w_anom: 0.0
  w_smoothap: 0.0              # redundant with ranking objective -> off
