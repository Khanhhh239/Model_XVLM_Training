# X-VLM-v4 (Model B) -- MAXIMALIST wrong-case coverage on FULL 1M, single A100 40GB.
# Turns ON every head so the architecture targets the most failure categories:
#   ITM (rerank, #2/#4) + box-grounding (#3/#7, the largest group) + pose (#1 proxy) + anomaly + FILIP.
# COST/PREREQ (the catch): box-grounding only helps if you first build phrase->box pseudo-labels:
#   python -m startv4.scripts.build_box_pseudolabels --manifest data/manifest_1m.parquet \
#       --detector groundingdino --out data/box_pseudolabels.jsonl   (~10-20h one-time)
# pose needs ViTPose keypoints in the manifest (train) AND on the 36K gallery at inference.
# Strongest cross-encoder = warm_start from the pretrained X-VLM in .. (repo root / train2).
model:
  name: hf
  image_model: microsoft/swin-base-patch4-window7-224
  text_model: bert-base-uncased
  embed_dim: 256
  cross_layers: 6
  cross_heads: 8
  num_anomaly_classes: 3
  use_pose: true            # #1 (off-balance proxy) -- needs ViTPose at train + gallery infer
  use_anomaly: true         # free synthetic label
  use_box: true             # #3/#7 -- REQUIRES the GroundingDINO pass above, else near-trivial
  use_filip: true           # #2/#4 verbs
  filip_dim: 256

data:
  manifest: data/manifest_1m.parquet
  image_root: data/images
  image_size: 512
  max_token: 64
  num_workers: 16
  sampler: pair             # same-video hard pairs feed the ITM hard-neg sampler

train:
  batch_size: 24            # 40GB: ITM does 3x cross-encoder forwards + FILIP(chunked) + heads
  seed: 42

optim:
  lr: 2.0e-4
  wd: 0.05
  epochs: 3                 # full 1M is heavy here -> consider a hard-pair subset / fewer epochs
  warmup_epochs: 1
  grad_clip: 1.0
  bf16: true
  grad_checkpoint: true     # now honoured for X-VLM (hf_vision/hf_text)
  ema: true
  ema_decay: 0.999
  queue_size: 32768         # ITC negatives (smaller than 65K to save 40GB)
  warm_start: null          # e.g. ../best.pth (pretrained X-VLM at repo root) -- strongly recommended
  w_itc: 1.0
  w_itm: 1.5
  w_filip: 0.5
  w_box: 0.5
  w_anom: 0.3
  w_smoothap: 0.0           # redundant with ITC ranking -> off (save compute)
