# SigLIP-2-L retrieval (Model A / Phase 1).
# RIGHT-SIZE, don't fill VRAM.  This is a LOW-LR LoRA fine-tune that preserves the pretrain, so
# gradients are small -> batch beyond ~64-128 gives diminishing returns AND fewer steps/epoch.
# Pick batch for convergence/throughput, NOT to "use the 80GB".  At batch 64 @512 + bf16 +
# grad-checkpointing this fits ~20-30GB -> a 40GB GPU is enough for this stage (cheaper).
# Step up to 80GB / 768-FixRes / X-VLM only if distractor-val proves it's needed.
model:
  name: google/siglip2-large-patch16-512   # VERIFY id + a 1-step VRAM profile before renting
  embed_dim: 1024
  patch: 16
  image_size: 512
  lora:
    enabled: true
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, out_proj]

data:
  manifest: data/manifest_1m.parquet
  image_root: data/images
  image_size: 512
  max_token: 64
  num_workers: 16
  sampler: balanced            # 'balanced' (normal/anomaly) or 'pair' (same-video hard pairs)

train:
  batch_size: 64               # convergence-sized, not VRAM-sized
  seed: 42

optim:
  lr: 5.0e-5                   # LOW on purpose -> keep SigLIP real-pretrain (sim2real core)
  wd: 0.05
  epochs: 4                    # start small; a preserved-pretrain LoRA converges fast.
  warmup_epochs: 1             # cosine warmup
  grad_clip: 1.0
  bf16: true
  grad_checkpoint: true
  ema: true
  ema_decay: 0.999
  use_filip: false             # add-on; keep off for the clean baseline
  w_filip: 0.5

# Pragmatic loop: train on a 300-500K balanced SUBSET first, pass --val-index/--val-query-json
# --eval-every to early-stop on distractor-val (save the BEST), and only scale data/epochs if the
# metric is still climbing.  Don't pay for 1M x 8 if it plateaus at 400K x 2.

aug:
  crop_min: 0.8
  jpeg_p: 0.4
  downscale_p: 0.3
  blur_p: 0.3
  noise_p: 0.2
  erase_p: 0.25
