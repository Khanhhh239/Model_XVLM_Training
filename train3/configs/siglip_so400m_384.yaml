# SigLIP-2 so400m @384 -- the RIGHT-SIZED backbone option (Model A / Phase 1).
# so400m is shape-optimised: it often matches/beats the large@512 per-FLOP at lower resolution,
# so it is cheaper to train AND to serve.  Measure BOTH this and large@512 zero-shot on
# distractor-val (scripts.zeroshot_baseline) and pick by mAP-per-GPU-hour, not by "bigger=better".
# Fits comfortably in 24-40GB at batch 64-96 @384.
model:
  name: google/siglip2-so400m-patch16-384   # verify exact id on HF
  embed_dim: 1152
  patch: 16
  image_size: 384
  lora:
    enabled: true
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, out_proj]

data:
  manifest: data/manifest_1m.parquet
  image_root: data/images
  image_size: 384
  max_token: 64
  num_workers: 16
  sampler: balanced

train:
  batch_size: 96
  seed: 42

optim:
  lr: 5.0e-5
  wd: 0.05
  epochs: 4
  warmup_epochs: 1
  grad_clip: 1.0
  bf16: true
  grad_checkpoint: true
  ema: true
  ema_decay: 0.999
  use_filip: false
  w_filip: 0.5

aug:
  crop_min: 0.8
  jpeg_p: 0.4
  downscale_p: 0.3
  blur_p: 0.3
  noise_p: 0.2
  erase_p: 0.25
