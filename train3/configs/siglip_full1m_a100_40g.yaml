# SigLIP-2 retrieval (Model A) -- STRONGEST run on FULL ~1M PAB synthetic, single A100 40GB.
# Fits 40GB: large@512 LoRA + bf16 + grad-checkpoint at batch 48 ≈ 28-34GB. If OOM, drop to 32.
# (For more headroom / cheaper, swap to configs/siglip_so400m_384.yaml and measure both.)
# Use --val-index/--val-query-json --eval-every to early-stop on distractor-val (saves BEST).
model:
  name: google/siglip2-large-patch16-512   # verify id + 1-step VRAM profile before the long run
  embed_dim: 1024
  patch: 16
  image_size: 512
  lora:
    enabled: true
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, out_proj]

data:
  manifest: data/manifest_1m.parquet      # FULL ~1,013,605 synthetic pairs
  image_root: data/images
  image_size: 512
  max_token: 64
  num_workers: 16
  sampler: balanced

train:
  batch_size: 48                          # 40GB-sized; raise only if a 1-step profile leaves room
  seed: 42

optim:
  lr: 5.0e-5                              # low -> preserve real-pretrain (sim2real core)
  wd: 0.05
  epochs: 3                              # full 1M; early-stop on distractor-val (don't over-epoch)
  warmup_epochs: 1
  grad_clip: 1.0
  bf16: true
  grad_checkpoint: true
  ema: true
  ema_decay: 0.999
  use_filip: true                        # verb/action recall (#2/#4) at the retrieval stage
  w_filip: 0.5
  filip_chunk: 8                         # REQUIRED at 512: caps FILIP [B,B,Ni,Nt] memory

aug:                                     # sim2real augmentation -> covers #9 (blur) #6 (text) #8 (occlusion)
  crop_min: 0.8
  jpeg_p: 0.4
  downscale_p: 0.3
  blur_p: 0.3
  noise_p: 0.2
  erase_p: 0.25

# FixRes 768 final stage (covers #4/#5): re-run with
#   --set data.image_size=768 optim.lr=1e-5 optim.epochs=1 train.batch_size=12
# only if distractor-val shows small-object/foreground still failing.
